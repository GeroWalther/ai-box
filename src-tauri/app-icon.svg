<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source for the native icon set (`npx tauri icon src-tauri/app-icon.svg`).
       Separate from public/icon.svg because macOS icons need transparent margin
       around the rounded square — a full-bleed mark renders visibly larger than
       every other icon in the dock. Artwork sits in the 100..924 safe area. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b6ef0"/>
      <stop offset="100%" stop-color="#5a48e8"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g transform="translate(512 528) scale(1.3) translate(-512 -528)">
  <!-- A box drawn in one continuous stroke, with the lid open: the machine that
       holds everything, reachable from outside. -->
  <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M336 470 L512 392 L688 470 L512 548 Z" opacity="0.95"/>
    <path d="M336 470 L336 632 L512 710 L688 632 L688 470" opacity="0.95"/>
    <path d="M512 548 L512 710" opacity="0.6"/>
  </g>

  <!-- Three dots rising out of the box: the AI answering from inside it. -->
  <circle cx="512" cy="316" r="20" fill="#ffffff" opacity="0.95"/>
  <circle cx="588" cy="336" r="14" fill="#ffffff" opacity="0.6"/>
  <circle cx="436" cy="336" r="14" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
