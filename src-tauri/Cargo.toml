[package]
name = "novel-studio"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "novel_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
base64 = "0.22"
tokio = { version = "1", features = ["time", "process", "macros", "io-util", "net", "sync", "rt-multi-thread"] }
# Companion HTTP+WebSocket server for phone/remote access (serves the built UI + mirrors commands).
axum = { version = "0.7", features = ["ws"] }
uuid = { version = "1", features = ["v4"] }
local-ip-address = "0.6"
# URL parsing for SSRF host validation on web_fetch / download.
url = "2"
# macOS Keychain storage for API keys (at rest), instead of plaintext localStorage.
keyring = { version = "3", features = ["apple-native"] }
# Pseudo-terminal for the interactive Terminal tab (real shell: claude, vim, top…).
portable-pty = "0.8"

