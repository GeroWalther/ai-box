name: release

# Build, sign, and notarize a macOS .dmg in CI. MANUAL ONLY.
#
# Releases are cut locally with scripts/release.sh, which signs and notarizes on
# the machine that already holds the Developer ID certificate. This workflow is
# the CI alternative, and it cannot run until the Apple secrets below are set in
# the repo (Settings → Secrets and variables → Actions) — none of them are.
# Without APPLE_CERTIFICATE the build compiles for four minutes and then dies on
# `security import`, which is what it did on every tag from v0.2.4 to v0.3.0
# while the real release published fine beside it.
#
# So it no longer runs on tags: a workflow that has never once succeeded should
# not email a failure on every release. Run it by hand if CI signing is ever set
# up properly. See docs/SIGNING.md.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: npm ci

      - name: Build, sign & notarize
        uses: tauri-apps/tauri-action@v0
        env:
          # Developer ID Application cert (base64 of the exported .p12) + its password.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # e.g. "Developer ID Application: Your Name (TEAMID)"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization: Apple ID, an app-specific password, and the Team ID.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater signing key (from `tauri signer generate`) so auto-updates verify.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Universal binary so one .dmg runs on Apple Silicon AND Intel Macs.
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: "AI Box ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
